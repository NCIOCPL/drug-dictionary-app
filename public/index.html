<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<title>NCI Search Results - National Cancer Institute</title>
		<link rel="stylesheet" href="%PUBLIC_URL%/index.css" />
		<link rel="stylesheet" href="%PUBLIC_URL%/__nci-dev__common.css" />
		<script type="text/javascript">
			// Graceful WebSocket error handling for Pa11y testing
			// This makes WebSocket connections fail gracefully without breaking Pa11y
			(function() {
				// Check if we're in Pa11y testing environment
				var isPa11yTesting = navigator.userAgent.includes('pa11y') ||
					navigator.userAgent.includes('HeadlessChrome') && !window.Cypress;

				if (isPa11yTesting) {
					console.log('🧪 Pa11y testing detected - enabling graceful WebSocket handling');

					// Store original constructors
					var OriginalWebSocket = window.WebSocket;
					var OriginalSockJS = window.SockJS;
					var OriginalEventSource = window.EventSource;

					// Enhanced WebSocket with graceful error handling
					if (OriginalWebSocket) {
						window.WebSocket = function(url, protocols) {
							console.log('🔌 Creating WebSocket with graceful error handling for Pa11y');
							try {
								var ws = new OriginalWebSocket(url, protocols);

								// Add timeout to prevent hanging connections
								var connectionTimeout = setTimeout(function() {
									if (ws.readyState === WebSocket.CONNECTING) {
										console.log('⏰ WebSocket connection timeout - closing for Pa11y');
										ws.close();
									}
								}, 1000); // 1 second timeout

								// Clear timeout on successful connection
								ws.addEventListener('open', function() {
									clearTimeout(connectionTimeout);
									console.log('✅ WebSocket connected successfully');
								});

								// Suppress error events that break Pa11y
								ws.addEventListener('error', function(event) {
									console.log('🔇 WebSocket error suppressed for Pa11y:', event.type);
									event.stopPropagation();
									event.preventDefault();
								});

								// Handle close events gracefully
								ws.addEventListener('close', function(event) {
									clearTimeout(connectionTimeout);
									console.log('🔌 WebSocket closed gracefully');
								});

								return ws;
							} catch (error) {
								console.log('🔇 WebSocket creation error suppressed for Pa11y:', error.message);
								// Return a mock closed WebSocket
								return {
									readyState: 3,
									CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3,
									send: function() {},
									close: function() {},
									addEventListener: function() {},
									removeEventListener: function() {}
								};
							}
						};
						// Copy static properties
						window.WebSocket.CONNECTING = 0;
						window.WebSocket.OPEN = 1;
						window.WebSocket.CLOSING = 2;
						window.WebSocket.CLOSED = 3;
					}

					// Enhanced SockJS with graceful error handling
					if (OriginalSockJS) {
						window.SockJS = function(url, protocols, options) {
							console.log('🔌 Creating SockJS with graceful error handling for Pa11y');
							try {
								var sockjs = new OriginalSockJS(url, protocols, options);

								// Add timeout
								var connectionTimeout = setTimeout(function() {
									if (sockjs.readyState === 0) { // CONNECTING
										console.log('⏰ SockJS connection timeout - closing for Pa11y');
										sockjs.close();
									}
								}, 1000);

								// Suppress errors
								sockjs.addEventListener('error', function(event) {
									console.log('🔇 SockJS error suppressed for Pa11y:', event.type);
									event.stopPropagation();
									event.preventDefault();
								});

								sockjs.addEventListener('open', function() {
									clearTimeout(connectionTimeout);
								});

								sockjs.addEventListener('close', function() {
									clearTimeout(connectionTimeout);
								});

								return sockjs;
							} catch (error) {
								console.log('🔇 SockJS creation error suppressed for Pa11y:', error.message);
								return {
									readyState: 3,
									CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3,
									send: function() {},
									close: function() {},
									addEventListener: function() {},
									removeEventListener: function() {}
								};
							}
						};
					}
				}
			})();
		</script>
		<script type="text/javascript">
			// Only setup the handler if this is not running under cypress.
			if (!window.Cypress) {
				// Debugging for testing out new AnalyticsHandler.
				(function () {
					var pusher = function () {
						// Get all the arguments, as push takes in n number of arguments.
						for (var i = 0; i < arguments.length; i++) {
							console.log(arguments[i]);
						}
					};
					// Initialize the NCIDataLayer
					window.NCIDataLayer = window.NCIDataLayer || [];
					// Set our pusher if it is not already set
					// this should avoid accidental re-initializations
					if (window.NCIDataLayer.push === Array.prototype.push) {
						// Process all the existing items until the queue is
						// empty.
						var existingItem;
						while ((existingItem = window.NCIDataLayer.shift()) !== undefined) {
							pusher(existingItem);
						}
						window.NCIDataLayer.push = pusher;
					}
				})();
			}
		</script>
		<script type="text/javascript">
			function getUrlVars() {
				var vars = {};
				var parts = window.location.href.replace(
					/[?&]+([^=&]+)=([^&]*)/gi,
					function (m, key, value) {
						vars[key] = value;
					}
				);
				return vars;
			}
			function getUrlParam(parameter, defaultvalue) {
				var urlparameter = defaultvalue;
				if (window.location.href.indexOf(parameter) > -1) {
					urlparameter = getUrlVars()[parameter];
				}
				return urlparameter;
			}
			window.publicUrl = '%PUBLIC_URL%';
			const configIndex = getUrlParam('cfg', '0');
			window.currentConfig = configIndex;
			const cfgs = [
				{
					analyticsChannel: 'Publications',
					analyticsHandler: 'EddlAnalyticsHandler',
					analyticsName: 'Drug',
					analyticsPublishedDate: 'unknown',
					analyticsContentGroup: 'NCI Drug Dictionary',
					apiEndpoint: 'https://webapis.cancer.gov/drugdictionary/v1/',
					appId: '@@/DEFAULT_SWS_APP_ID',
					baseHost: 'http://localhost:3000',
					basePath: '/',
					canonicalHost: 'https://www.cancer.gov',
					dictionaryIntroText:
						"The NCI Drug Dictionary contains technical definitions and synonyms for drugs/agents used to treat patients with cancer or conditions related to cancer. Each drug entry includes links to check for clinical trials listed in NCI's List of Cancer Clinical Trials.",
					dictionaryTitle: 'NCI Drug Dictionary',
					ctsDynamicListingPageBase:
						'https://www.cancer.gov/about-cancer/treatment/clinical-trials/intervention',
					language: 'en',
					nciThesaurusConceptLink:
						'https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI%20Thesaurus',
					rootId: 'NCI-app-root',
					siteName: 'National Cancer Institute',
				},
			];

			window.APP_PARAMS = cfgs[configIndex];
		</script>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div class="mock-header">
			<div>
				<img
					class="logo"
					src="https://www.cancer.gov/publishedcontent/images/images/design-elements/logos/nci-logo-full.__v1.svg"
					alt="National Cancer Institiute"
				/>
			</div>
			<div class="mock-language-bar">
				<div id="LangList1">
					<ul>
						<li><a href="/replaceme">Language Toggle</a></li>
					</ul>
				</div>
			</div>
		</div>

		<main id="main-content" class="main-content">
			<div class="general-page-body-container">
				<div class="content-container contentzone">
					<div id="NCI-app-root"></div>
				</div>
			</div>
		</main>
		<div class="jm-wrapper">
			<select id="jm1" class="jumpmenu" aria-label="Select Configuration">
				<option value="0">Drug Dictionary</option>
			</select>
		</div>
		<script type="text/javascript">
			document.getElementById('jm1').value = window.currentConfig;
			function initJumpMenus() {
				// Turns all <select> elements with the 'jumpmenu' class into jump menus
				var selectElements = document.getElementsByTagName('select');
				for (i = 0; i < selectElements.length; i++) {
					// Check for the class and make sure the element has an ID
					if (
						selectElements[i].className == 'jumpmenu' &&
						document.getElementById(selectElements[i].id) != ''
					) {
						jumpmenu = document.getElementById(selectElements[i].id);
						jumpmenu.onchange = function () {
							if (this.options[this.selectedIndex].value != '') {
								// Redirect
								location.href =
									window.publicUrl +
									'?cfg=' +
									this.options[this.selectedIndex].value;
							}
						};
					}
				}
			}
			window.onload = function () {
				document.documentElement.setAttribute(
					'lang',
					window.APP_PARAMS.language
				);
				// hide language toggle if no spanish base provided
				document.querySelector('.mock-language-bar').style.display =
					window.APP_PARAMS.altLanguageDictionaryBasePath &&
					window.APP_PARAMS.altLanguageDictionaryBasePath !== ''
						? 'block'
						: 'none';
				initJumpMenus();
			};
		</script>
	</body>
</html>
